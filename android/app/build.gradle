apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

android {
    namespace = "com.sesaloy.hermes"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sesaloy.hermes"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a"
        }
        python {
            version "3.11"
            def hermesPy = System.getenv("HERMES_PYTHON")
            buildPython (hermesPy ?: "C:/Program Files/Python311/python.exe")
            pip {
                install "-r", "src/main/python/requirements-hermes-android.txt"
                // 注意：不手动配options——Chaquopy内部自己处理Chaquo仓库+PyPI的依赖解析，
                // 手动配index会破坏它（Android wheel与纯Python包跨源依赖会失败）。首次装依赖走国外源较慢属正常。
            }
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // 仅在提供签名环境变量时启用（CI 从 secrets 注入）
        release {
            def keystoreB64 = System.getenv('KEYSTORE_BASE64')
            if (keystoreB64 != null && !keystoreB64.isEmpty()) {
                def keystoreFile = file("${buildDir}/release-keystore.jks")
                storeFile = keystoreFile
                storePassword = System.getenv('KEYSTORE_PASSWORD')
                keyAlias = System.getenv('KEY_ALIAS')
                keyPassword = System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def hasKeystore = System.getenv('KEYSTORE_BASE64') != null && !System.getenv('KEYSTORE_BASE64').isEmpty()
            signingConfig hasKeystore ? signingConfigs.release : null
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

tasks.register("pruneHermesPythonAssets") {
    description = "Remove generated/cache-only Python files before Chaquopy packages Hermes."
    doLast {
        def pythonRoot = file("src/main/python")
        if (!pythonRoot.exists()) {
            return
        }

        def pycacheDirs = []
        pythonRoot.eachFileRecurse { f ->
            if (f.directory && f.name == "__pycache__") {
                pycacheDirs << f
            }
        }
        pycacheDirs.each { it.deleteDir() }

        // Android ships the runtime TUI bundle from assets/hermes-tui so
        // MainActivity can extract it next to the bundled Node executable.
        // The Python wheel fallback would duplicate the same entry.js in
        // Chaquopy's app.imy and is unused on Android.
        delete file("src/main/python/hermes_cli/tui_dist")
    }
}

preBuild.dependsOn("pruneHermesPythonAssets")

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
