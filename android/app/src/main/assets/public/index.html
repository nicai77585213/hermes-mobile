<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0E13">
<title>御衡</title>
<style>
:root{
  --bg:#0A0E13;--card:#121826;--gold:#D4AF6A;--gold-dim:#FFB74D;--text:#E8E6DF;
  --text-dim:#8A93A6;--outline:#1E2A3F;--err:#EF5350;--ok:#66BB6A;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:radial-gradient(120% 90% at 50% 0%,#131B2B 0%,var(--bg) 55%);
  color:var(--text);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
  min-height:100dvh;
}
.box{width:min(86vw,400px);display:grid;gap:18px;text-align:center}
.logo{width:64px;height:64px;margin:0 auto;filter:drop-shadow(0 0 14px rgba(212,175,106,.45))}
h1{font-size:26px;letter-spacing:6px;color:var(--gold);text-shadow:0 0 18px rgba(212,175,106,.35)}
.sub{font-size:12px;color:var(--text-dim);letter-spacing:2px}
.card{background:var(--card);border:1px solid var(--outline);border-radius:16px;padding:18px;display:grid;gap:12px;text-align:left}
label{font-size:12px;color:var(--text-dim)}
input{
  width:100%;background:#0D1220;border:1px solid var(--outline);border-radius:10px;
  color:var(--text);font-size:15px;padding:12px 14px;outline:none;
}
input:focus{border-color:var(--gold-dim)}
.btn{
  background:linear-gradient(135deg,#D4AF6A,#C29A52);color:#14100A;border:none;border-radius:12px;
  font-size:15px;font-weight:700;padding:13px;cursor:pointer;letter-spacing:2px;
}
.btn:active{transform:scale(.97)}
.msg{font-size:12px;min-height:16px}
.msg.ok{color:var(--ok)} .msg.err{color:var(--err)}
.boot{display:grid;gap:14px;justify-items:center;padding:30px 0}
.bar{width:70%;height:3px;border-radius:999px;background:#1E2A3F;overflow:hidden}
.bar i{display:block;width:40%;height:100%;border-radius:inherit;background:var(--gold);
  animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
.hidden{display:none}
</style>
</head>
<body>
<main class="box">
  <div id="bootView" class="boot">
    <svg class="logo" viewBox="0 0 40 40" role="img" aria-label="御衡">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FFD98A"/><stop offset="1" stop-color="#C29A52"/>
      </linearGradient></defs>
      <path d="M20 2 L36 11 V29 L20 38 L4 29 V11 Z" fill="none" stroke="url(#lg)" stroke-width="2.2"/>
      <path d="M15 27 V13 H18 L22 22 L25 13 H28 V27" fill="none" stroke="url(#lg)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="20" cy="30.5" r="1.4" fill="#FFB74D"/>
    </svg>
    <h1>御衡</h1>
    <div class="sub">正在启动</div>
    <div class="bar"><i></i></div>
  </div>

  <div id="connView" class="card hidden">
    <h2 style="font-size:17px;letter-spacing:3px;color:var(--gold)">连接设置</h2>
    <label>电脑服务地址</label>
    <input id="hostInput" placeholder="192.168.x.x:8400" inputmode="url" autocomplete="off">
    <button class="btn" id="btnConnect">连 接</button>
    <div class="msg" id="msg"></div>
  </div>
</main>

<script>
(function(){
  var LS_NEW='hermes.server.url', LS_OLD='hermes_host';
  var saved=null;
  try{ saved=localStorage.getItem(LS_NEW)||localStorage.getItem(LS_OLD); }catch(e){}

  if(saved){
    // 已有地址 → 直接进驾驶舱
    setTimeout(function(){ location.href='dashboard.html'; }, 600);
    return;
  }

  // 无地址 → 显示连接设置
  document.getElementById('bootView').classList.add('hidden');
  document.getElementById('connView').classList.remove('hidden');

  function normalizeHost(v){
    v=(v||'').trim().replace(/^https?:\/\//i,'').replace(/\/+$/,'');
    if(!v) return '';
    if(!/:\d+$/.test(v)) v=v+':8400';
    return 'http://'+v;
  }

  document.getElementById('btnConnect').addEventListener('click',function(){
    var url=normalizeHost(document.getElementById('hostInput').value);
    var msg=document.getElementById('msg');
    if(!url){ msg.className='msg err'; msg.textContent='请输入电脑服务地址'; return; }
    msg.className='msg ok'; msg.textContent='正在连接...';
    fetch(url+'/health',{method:'GET',timeout:5000}).then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      try{ localStorage.setItem(LS_NEW,url); localStorage.setItem(LS_OLD,url); }catch(e){}
      location.href='dashboard.html';
    }).catch(function(){
      // 测试失败也允许进入(可能在配置中)
      try{ localStorage.setItem(LS_NEW,url); localStorage.setItem(LS_OLD,url); }catch(e){}
      location.href='dashboard.html';
    });
  });
})();
</script>
</body>
</html>
