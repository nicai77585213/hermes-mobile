<!DOCTYPE html><html lang="zh"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hermes Link</title>
<style>
:root{--bg:#0a0d14;--card:#121826;--gold:#d4af6a;--ice:#7ec8e3;--purple:#9d8fe8;--text:#e8e6df;--dim:#8a93a6;--line:#1e2a3f}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;padding:30px;text-align:center}
.logo{font-size:32px;font-weight:700;color:var(--gold);text-shadow:0 0 30px rgba(212,175,106,.4);margin-bottom:8px}
.sub{font-size:11px;color:var(--dim);letter-spacing:3px;margin-bottom:40px}
input{width:100%;max-width:280px;padding:14px 18px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--text);font-size:15px;text-align:center;outline:none;margin-bottom:16px}
input:focus{border-color:var(--gold)}
button{width:100%;max-width:280px;padding:14px;background:var(--gold);border:none;border-radius:12px;color:var(--bg);font-size:15px;font-weight:700;cursor:pointer;margin-bottom:10px}
button:active{opacity:.8}
.status{font-size:11px;color:var(--dim);margin-top:10px}
.loading{margin-top:30px}.spinner{width:40px;height:40px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
<div class="logo">HERMES LINK</div><div class="sub">远程驾驶舱</div>

<div id="form">
<input type="text" id="ip" placeholder="电脑IP 如 192.168.1.100" value="192.168.10.192">
<button onclick="connect()">连接</button>
<div class="status" id="msg"></div>
</div>

<div id="loading" style="display:none">
<div class="spinner"></div><div>连接中...</div>
</div>

<script>
async function connect(){
let ip=document.getElementById('ip').value.trim()||'192.168.10.192';
let url='http://'+ip+':8400';
document.getElementById('form').style.display='none';
document.getElementById('loading').style.display='block';
try{
let r=await fetch(url+'/health');
let d=await r.json();
if(d.ok){
localStorage.setItem('hermes_host',url);
location.href=url;
}else{
document.getElementById('msg').textContent='连接失败，检查IP';
document.getElementById('form').style.display='block';
document.getElementById('loading').style.display='none';
}
}catch(e){
document.getElementById('msg').textContent='无法连接 '+ip+':8400';
document.getElementById('form').style.display='block';
document.getElementById('loading').style.display='none';
}
}

// Auto-detect saved
let saved=localStorage.getItem('hermes_host');
if(saved){
document.getElementById('form').style.display='none';
document.getElementById('loading').style.display='block';
fetch(saved+'/health').then(r=>r.json()).then(d=>{
if(d.ok)location.href=saved;
else{
document.getElementById('form').style.display='block';
document.getElementById('loading').style.display='none';
}
}).catch(()=>{
document.getElementById('form').style.display='block';
document.getElementById('loading').style.display='none';
});
}
</script></body></html>
